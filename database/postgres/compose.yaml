services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PICDB_POSTGRES_DB:-picdb}
      POSTGRES_USER: ${PICDB_POSTGRES_USER:-picdb}
      POSTGRES_PASSWORD: ${PICDB_POSTGRES_PASSWORD:?Set PICDB_POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${PICDB_POSTGRES_PORT:-55432}:5432"
    volumes:
      - picdb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  picdb_postgres_data:
